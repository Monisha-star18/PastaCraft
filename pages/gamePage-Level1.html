<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PastaCraft — Level 1 </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Chewy&display=swap" rel="stylesheet">
   
    <!-- custom css -->
    <link rel="stylesheet" href="../styles/gamePage-Level1.css">
</head>
<body>

    <div class="background">
        <img src="../asserts/imgaes/experiencePage/level1/background.png" class="level-bg">
    </div>


    <div class="steel-rod-wisker p-2">
        <img src="../asserts/imgaes/experiencePage/level1/Wisker.png" id="wisker" class="rod-elements">
    </div>

    <div class="steel-rod-kinfe px-2">
        <img src="../asserts/imgaes/experiencePage/level1/kinfe.png" id="kinfe" class="rod-elements">
    </div>

    <div class="steel-rod-spoon px-5">
        <img src="../asserts/imgaes/experiencePage/level1/spoon.png" id="spoon" class="rod-elements">
    </div>
    
    <div class="steel-rod-rollingPin px-5">
        <img src="../asserts/imgaes/experiencePage/level1/rollingPin.png" id="rollingPin" class="rod-elements">
    </div>



    <!-- jquery cdn -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap Bundle JS (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- filp cdn -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <!-- custom js -->
    <script src="../scripts/gamePage-Level1.js"></script>

</html>
