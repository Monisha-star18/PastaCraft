<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PastaCraft — Level 1 </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Chewy&display=swap" rel="stylesheet">
   
    <!-- custom css -->
    <link rel="stylesheet" href="../styles/gamePage-Level1.css">
</head>
<body>

    <div class="background">
        <img src="../asserts/imgaes/experiencePage/level1/background.png" class="level-bg">
    </div>


    <div class="steel-rod-wisker p-2">
        <img src="../asserts/imgaes/experiencePage/level1/tools/Wisker.png" id="wisker" class="rod-elements">
    </div>

    <div class="steel-rod-kinfe px-2">
        <img src="../asserts/imgaes/experiencePage/level1/tools/kinfe.png" id="kinfe" class="rod-elements">
    </div>

    <div class="steel-rod-spoon px-5">
        <img src="../asserts/imgaes/experiencePage/level1/tools/spoon.png" id="spoon" class="rod-elements">
    </div>
    
    <div class="steel-rod-rollingPin px-5">
        <img src="../asserts/imgaes/experiencePage/level1/tools/rollingPin.png" id="rollingPin" class="rod-elements">
    </div>

    <img src="../asserts/imgaes/experiencePage/level1/Ingredients/whiteFlour.png" alt="whiteFlour" class="Ingredients" id="whiteFlour" >
    <img src="../asserts/imgaes/experiencePage/level1/Ingredients/waterJug.png" alt="waterJug" class="Ingredients" id="waterJug" >
    <img src="../asserts/imgaes/experiencePage/level1/Ingredients/salt.png" alt="salt" class="Ingredients" id="salt" >
    <img src="../asserts/imgaes/experiencePage/level1/Ingredients/oliveOil.png" alt="oliveOil" class="Ingredients" id="oliveOil" >

    
    <div class="Ingredients eggs-div" id="eggs-div" >
        <img src="../asserts/imgaes/experiencePage/level1/Ingredients/eggs.png" alt="eggs" id="eggs" >
        <img src="../asserts/imgaes/experiencePage/levels/{E6C6691C-AD67-4755-9014-A467FAA49920}.png" id="danger">
    </div>
    

    

    
    <!-- jquery cdn -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap Bundle JS (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- filp cdn -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- custom js -->
    <script  src="../scripts/gamePage-Level2.js"></script>
</body>
</html>
